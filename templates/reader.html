<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>__PAGE_TITLE__</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0c1b2d;--card:#10243a;--line:rgba(130,181,218,.2);--text:#eef6ff;--muted:#b5c7d9;--soft:#829bb3;--cyan:#63d7e8;--blue:#80b9ff;--purple:#b8a8ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse 70% 28% at 88% 0%,rgba(62,105,183,.18),transparent 70%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(1500px,calc(100% - 44px));margin:auto;padding:38px 0 70px}
h1{font-size:clamp(27px,2.7vw,42px);line-height:1.35;margin:0 0 8px;font-weight:780;letter-spacing:-.03em}
header .sub{color:#a9bfd3;line-height:1.75;font-size:14px;margin:0 0 22px}.head-cn{font-size:15px;color:#a8ddea;font-weight:650;margin-bottom:5px}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 30px}.nav a{text-decoration:none;color:#afc2d6;border:1px solid var(--line);background:#0d1c2e;border-radius:8px;padding:8px 11px;font-size:12px}.nav a:hover{border-color:#5bafc7;color:#e8fbff}
.reviewer-view{margin:0 0 28px;padding:22px;border:1px solid rgba(112,190,220,.23);border-radius:15px;background:linear-gradient(145deg,rgba(16,34,54,.97),rgba(10,24,40,.97))}
.reviewer-kicker,.eyebrow{font:700 10px ui-monospace,monospace;letter-spacing:.15em;color:var(--cyan)}.reviewer-intro h2{font-size:21px;margin:7px 0;line-height:1.45}

.reviewer-card h3,.reviewer-example h3{font-size:15px;margin:9px 0 6px}.reviewer-card p,.reviewer-example-head p,.reviewer-step p{font-size:13px;line-height:1.8;color:#c0d0df;margin:0;white-space:pre-line}

.result h2{font-size:21px;line-height:1.5;margin:14px 0 9px}.result p{color:var(--muted);font-size:14px;line-height:1.8;margin:0}.loc{margin-top:15px;border-top:1px solid var(--line);padding-top:10px;color:var(--soft);font-size:11px;line-height:1.7}
.tree{min-width:0;border-left:1px solid rgba(105,190,220,.3);padding-left:21px;position:relative}.tree:before{content:"";position:absolute;left:0;top:17px;width:18px;height:1px;background:#5a9db5}
.treetop{display:flex;gap:10px;align-items:center;margin-bottom:14px}.treetop b{padding:7px 12px;background:rgba(105,130,216,.12);color:#d9d8ff;border:1px solid rgba(155,164,236,.26);border-radius:7px;font-size:13px}.treetop i{height:1px;background:linear-gradient(90deg,#6c8cab,transparent);flex:1}

.branch[data-level="2"]{background:linear-gradient(145deg,#203438,#17292d);border-color:#426065}.branch[data-level="3"]{background:linear-gradient(145deg,#302e3d,#242436);border-color:#5c556b}.branch[data-level="4"]{background:linear-gradient(145deg,#35302e,#292728);border-color:#6a5b54}
.branchhead{display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap;align-items:center}.branch h3{margin:0;font-size:15px;line-height:1.5}.branchtag{font-size:10px;color:#d5e3f0;background:rgba(119,148,177,.12);padding:3px 7px;border-radius:5px;border:1px solid #3c5268}
.branchgoal{color:#a8bbcc;font-size:12px;line-height:1.65;margin:8px 0 10px}.method{border-top:1px solid rgba(166,189,218,.15);padding-top:11px;margin-top:11px}
.method h4{color:#e9f1ff;margin:0 0 6px;font-size:15px;line-height:1.5}.method .core{font-size:14px;color:#9fe4f1;font-weight:650;line-height:1.65;margin:5px 0}.method .effect{color:#bdc9d8;font-size:12px;line-height:1.7;margin:6px 0 8px}.method .role{font-size:10px;color:#b8bcf1}
.details-btn{cursor:pointer;background:none;border:0;padding:7px 0 1px;color:#b3bcff;font-size:12px;font-weight:650;text-align:left}.details-btn:after{content:" ＋"}.details-btn[aria-expanded="true"]:after{content:" −"}
.details{margin-top:8px;border:1px solid rgba(125,165,210,.17);border-radius:8px;background:rgba(7,13,25,.4);padding:10px}.details[hidden]{display:none}
.drow{padding:6px 0;color:#b6c7db;line-height:1.7;font-size:12px;border-bottom:1px dotted rgba(151,187,218,.12)}.drow:last-child{border-bottom:0}.drow strong{display:block;color:#dcefff;font-size:11px;margin-bottom:2px}
.evidence{margin-top:13px;border:1px solid rgba(138,179,215,.2);border-radius:10px;padding:11px 12px;background:rgba(23,34,52,.72);display:flex;justify-content:space-between;align-items:center;gap:12px}
.evtitle{font-weight:670;font-size:12px;color:#d1dcf6}.evtext{color:#a9bacc;font-size:11px;line-height:1.7;margin-top:4px}.figure-buttons{display:flex;flex-wrap:wrap;gap:6px}
.figbtn{cursor:pointer;border:1px solid rgba(111,200,225,.3);background:rgba(79,156,181,.13);border-radius:7px;color:#a7e9f2;padding:9px 12px;font-size:11px;white-space:nowrap}.figbtn:hover{background:rgba(79,156,181,.22)}
.term-link{display:inline;cursor:pointer;color:#91e5f3;font:inherit;font-weight:620;padding:0 1px;background:none;border:0;border-bottom:1px dashed rgba(99,215,232,.7);text-decoration:none}.term-link:hover,.term-link:focus-visible{color:#d3fbff;background:rgba(99,215,232,.08);outline:none}
.formula-text{white-space:pre-wrap}.formula-symbol{padding:0}
.term-popover{z-index:20000;position:fixed;width:min(370px,calc(100vw - 24px));max-height:min(65vh,440px);overflow:auto;padding:0;border:1px solid rgba(99,215,232,.46);border-radius:13px;background:linear-gradient(155deg,#10263d,#091a2c);box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 25px rgba(68,190,220,.08);display:none}
.term-popover.open{display:block}.term-popover-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(130,190,220,.17);position:sticky;top:0;background:rgba(10,27,45,.97)}
.term-popover-head span{font:700 9px ui-monospace,monospace;letter-spacing:.13em;color:var(--cyan)}.term-popover-close{width:25px;height:25px;border:1px solid rgba(112,184,215,.25);border-radius:6px;background:rgba(99,215,232,.08);color:#e4faff;font-size:17px;cursor:pointer}
.term-popover-body{padding:12px 14px 14px}.term-popover-title{font-size:16px;line-height:1.4;font-weight:780;color:#effbff;margin-bottom:8px;overflow-wrap:anywhere}
.term-popover-body h4{font-size:11px;color:var(--cyan);margin:10px 0 3px}.term-popover-body p{font-size:12px;line-height:1.65;color:#c4d5e4;margin:0;overflow-wrap:anywhere}
.modal{display:none;position:fixed;inset:0;z-index:10000;background:rgba(2,6,13,.92);align-items:center;justify-content:center;padding:35px 16px 18px;overflow:auto}.modal.open{display:flex}
.modal-box{position:relative;width:min(1450px,100%);max-height:calc(100vh - 54px);display:flex;flex-direction:column;border:1px solid rgba(107,185,218,.28);border-radius:13px;background:#091a2b;box-shadow:0 25px 90px rgba(0,0,0,.6);overflow:hidden}
.modal-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid rgba(110,179,211,.2)}
.modal-top h3{font-size:17px;margin:0 0 3px}.modal-top p{font-size:11px;color:#91a9c1;margin:0}.close-btn{border:1px solid rgba(106,179,213,.28);background:rgba(91,155,190,.09);color:#d8f5ff;border-radius:7px;width:30px;height:30px;font-size:19px;cursor:pointer;flex:0 0 auto}
.figure-modal-content{padding:14px 17px;overflow:auto}.figure-layout{display:flex;gap:15px;align-items:flex-start;justify-content:center}
.figure-stage{position:relative;min-width:0;flex:0 1 auto;line-height:0;background:#e8edf2;border-radius:8px;overflow:hidden}.figure-stage>img{display:block;width:auto;height:auto;max-width:100%;max-height:76vh;object-fit:contain;margin:auto}
.figure-hotspots{position:absolute;inset:0;pointer-events:none}.figure-hotspot{position:absolute;pointer-events:auto;border:1.5px solid rgba(75,213,232,.62);background:rgba(75,213,232,.07);border-radius:7px;cursor:pointer}
.figure-hotspot:hover,.figure-hotspot[aria-pressed="true"]{background:rgba(75,213,232,.17);border-color:#76e5f3}.figure-hotspot span{position:absolute;top:5px;left:5px;background:rgba(4,20,35,.92);border:1px solid rgba(115,211,234,.7);color:#e0fbff;padding:3px 7px;border-radius:999px;font:700 10px ui-monospace,monospace}
.panel-card[hidden]{display:none}.panel-card{width:min(420px,38vw);min-width:290px;max-height:76vh;overflow:auto;flex:0 0 auto;padding:15px;border:1px solid rgba(99,215,232,.4);border-radius:12px;background:linear-gradient(155deg,#152c44,#0c1c2e);line-height:1.6}
.panel-card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid rgba(130,190,220,.18);padding-bottom:9px}.panel-card-head h4{font-size:16px;margin:4px 0}.panel-card-kicker{font:700 9px ui-monospace,monospace;color:var(--cyan);letter-spacing:.12em}
.panel-card-image{display:block;width:100%;max-height:210px;object-fit:contain;background:#fff;border-radius:7px;margin:11px 0}.panel-card-section{padding-top:9px}.panel-card-section h5{font-size:11px;color:var(--cyan);margin:0 0 3px}.panel-card-section p{font-size:12px;color:#cbd8e6;line-height:1.7;margin:0}
.figure-desc{font-size:12px;color:#b7c8d8;line-height:1.75;margin:12px 0 0}.figure-hint{font-size:11px;color:#90ddeb;margin-top:9px}
.critical-review{margin-top:28px;border:1px solid rgba(135,175,210,.2);border-radius:13px;background:#0d1d30;padding:18px}.critical-review h2{font-size:19px;margin:0 0 12px}.critical-review p,.critical-review li{font-size:13px;line-height:1.8;color:#bdccda}
.sequence-divider{text-align:center;padding:9px;color:#9cb9c9;font-size:12px}
@media(max-width:980px){.module{grid-template-columns:1fr}.result{position:static}.branches{grid-template-columns:1fr}.figure-layout{flex-direction:column;align-items:stretch}.figure-stage>img{max-height:60vh}.panel-card{width:100%;min-width:0;max-height:40vh}}
@media(max-width:760px){main{width:calc(100% - 24px);padding-top:24px}.reviewer-grid{grid-template-columns:1fr}.reviewer-example-grid{grid-template-columns:1fr}.evidence{flex-wrap:wrap}.result{min-height:0;padding:17px}.result h2{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<body>
__MAIN__
<div class="term-popover" id="term-popover" role="dialog" aria-label="专业术语解释" aria-live="polite">
  <div class="term-popover-head"><span>TERM EXPLANATION</span><button class="term-popover-close" id="term-popover-close" type="button" aria-label="关闭">×</button></div>
  <div class="term-popover-body" id="term-popover-body"></div>
</div>
<div class="modal" id="figure-modal" role="dialog" aria-modal="true" aria-label="完整论文原图">
  <div class="modal-box">
    <div class="modal-top"><div><h3 id="fig-title"></h3><p id="fig-source"></p></div><button class="close-btn" data-close-figure type="button" aria-label="关闭原图">×</button></div>
    <div class="figure-modal-content">
      <div class="figure-layout">
        <div class="figure-stage" id="figure-stage"><img id="figure-image" alt="论文完整原图"><div class="figure-hotspots" id="figure-hotspots"></div></div>
        <aside class="panel-card" id="panel-card" hidden>
          <div class="panel-card-head"><div><div class="panel-card-kicker" id="panel-kicker"></div><h4 id="panel-title"></h4></div><button class="close-btn" id="panel-close" type="button" aria-label="关闭子图解释">×</button></div>
          <img class="panel-card-image" id="panel-image" alt="子图局部放大">
          <div id="panel-fields"></div>
        </aside>
      </div>
      <p class="figure-desc" id="figure-description"></p>
      <div class="figure-hint" id="figure-hint" hidden>点击原图中明确标注的子图字母查看解释；没有面板字母的图保持完整原图。</div>
    </div>
  </div>
</div>
<script>
"use strict";
const DATA=__PAPER_DATA__,TERMS=DATA.terms||{},FIGURES=DATA.figures||{};
let activeTermButton=null,activeFigure=null,activePanel=null;
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function termRows(){
 const rows=[];
 for(const [key,item] of Object.entries(TERMS)){
  if(item.formula_only)continue;
  const d=Array.isArray(item)?{full_name:item[0],chinese_name:item[1],definition:item[2],role:item[3],aliases:[]}:item;
  const aliases=new Set([key,d.full_name,d.chinese_name,...(d.aliases||[])].filter(Boolean));
  for(const alias of aliases)rows.push({alias:String(alias),key});
 }
 return rows.sort((a,b)=>b.alias.length-a.alias.length);
}
const TERM_ROWS=termRows();
function decorateTerms(root){
 if(!root||!TERM_ROWS.length)return;
 const patterns=TERM_ROWS.map(r=>{
  let p=escapeRegExp(r.alias).replace(/\s+/g,"\\s+");
  if(/^[A-Za-z0-9]/.test(r.alias))p="(?<![A-Za-z0-9_])"+p+"(?![A-Za-z0-9_])";
  return p;
 });
 const regex=new RegExp(patterns.join("|"),"gi");
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
  const e=n.parentElement;if(!e||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
  if(e.closest("script,style,button,a,textarea,input,select,pre,.term-popover,.figure-hotspots"))return NodeFilter.FILTER_REJECT;
  return NodeFilter.FILTER_ACCEPT;
 }});
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){
  const s=node.nodeValue;regex.lastIndex=0;if(!regex.test(s))continue;regex.lastIndex=0;
  const frag=document.createDocumentFragment();let cursor=0,m;
  while((m=regex.exec(s))){
   const row=TERM_ROWS.find(r=>r.alias.toLowerCase()===m[0].toLowerCase());if(!row)continue;
   if(m.index>cursor)frag.append(document.createTextNode(s.slice(cursor,m.index)));
   const b=document.createElement("button");b.type="button";b.className="term-link";b.dataset.term=row.key;b.textContent=m[0];b.setAttribute("aria-haspopup","dialog");frag.append(b);cursor=regex.lastIndex;
  }
  if(cursor<s.length)frag.append(document.createTextNode(s.slice(cursor)));
  if(cursor>0)node.parentNode.replaceChild(frag,node);
 }
}
function closeTerm(){
 const p=document.getElementById("term-popover");p.classList.remove("open");
 if(activeTermButton)activeTermButton.setAttribute("aria-expanded","false");activeTermButton=null;
}
function openTerm(key,button){
 const d=TERMS[key];if(!d)return;if(activeTermButton===button){closeTerm();return;}closeTerm();
 activeTermButton=button;button.setAttribute("aria-expanded","true");
 const item=Array.isArray(d)?{full_name:d[0],chinese_name:d[1],definition:d[2],role:d[3]}:d;
 const body=document.getElementById("term-popover-body");body.replaceChildren();
 const title=document.createElement("div");title.className="term-popover-title";title.textContent=button.classList.contains("formula-symbol")?button.textContent:key;body.append(title);
 const add=(label,value)=>{if(!value)return;const h=document.createElement("h4"),p=document.createElement("p");h.textContent=label;p.textContent=value;body.append(h,p);};
 add("英文全称",item.full_name);add("中文名称",item.chinese_name);add("准确含义",item.definition);add("通俗理解",item.analogy);add("在本文中的作用",item.role);add("来源",item.source);
 const pop=document.getElementById("term-popover");pop.classList.add("open");pop.style.visibility="hidden";pop.style.left="12px";pop.style.top="12px";
 const r=button.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight,m=12;
 let x=Math.min(Math.max(m,r.left),innerWidth-w-m),y=r.bottom+8;if(y+h>innerHeight-m)y=r.top-h-8;y=Math.max(m,Math.min(y,innerHeight-h-m));
 pop.style.left=x+"px";pop.style.top=y+"px";pop.style.visibility="visible";
}
function closePanel(){document.getElementById("panel-card").hidden=true;activePanel=null;document.querySelectorAll(".figure-hotspot").forEach(b=>b.setAttribute("aria-pressed","false"));}
function showPanel(fid,panel,button){
 if(activePanel===panel.letter){closePanel();return;}closePanel();activePanel=panel.letter;button.setAttribute("aria-pressed","true");
 const card=document.getElementById("panel-card");card.hidden=false;
 document.getElementById("panel-kicker").textContent="FIG. "+fid+" ("+panel.letter+")";
 document.getElementById("panel-title").textContent=panel.title;
 const img=document.getElementById("panel-image");
 if(panel.crop_image_data){img.src=panel.crop_image_data;img.hidden=false;}
 else{
  const source=document.getElementById("figure-image");
  if(source.complete&&source.naturalWidth){
   const [x0,y0,x1,y1]=panel.rect,sx=Math.round(x0*source.naturalWidth),sy=Math.round(y0*source.naturalHeight);
   const sw=Math.max(1,Math.round((x1-x0)*source.naturalWidth)),sh=Math.max(1,Math.round((y1-y0)*source.naturalHeight));
   const scale=Math.min(1.4,760/sw,360/sh),canvas=document.createElement("canvas");
   canvas.width=Math.max(1,Math.round(sw*scale));canvas.height=Math.max(1,Math.round(sh*scale));
   canvas.getContext("2d").drawImage(source,sx,sy,sw,sh,0,0,canvas.width,canvas.height);img.src=canvas.toDataURL("image/png");img.hidden=false;
  }else img.hidden=true;
 }
 const fields=document.getElementById("panel-fields");fields.replaceChildren();
 for(const [label,key] of [["实验目的","purpose"],["如何读图","how"],["观察结果","result"],["对论文结论的支撑","significance"],["解读边界","limit"],["原文位置","source"]]){
  if(!panel[key])continue;const s=document.createElement("div");s.className="panel-card-section";const h=document.createElement("h5"),p=document.createElement("p");h.textContent=label;p.textContent=panel[key];s.append(h,p);fields.append(s);
 }
 decorateTerms(card);
}
function openFigure(id){
 const f=FIGURES[id];if(!f)return;activeFigure=id;closePanel();closeTerm();
 document.getElementById("fig-title").textContent=f.title||("Fig. "+id);
 document.getElementById("fig-source").textContent=f.source||("Fig. "+id);
 document.getElementById("figure-description").textContent=f.description||"";decorateTerms(document.getElementById("figure-description"));
 const image=document.getElementById("figure-image");image.src=f.image_data;image.alt=f.title||("Fig. "+id);
 const hs=document.getElementById("figure-hotspots");hs.replaceChildren();
 const panels=f.has_explicit_panels===true?(f.panels||[]):[];
 document.getElementById("figure-hint").hidden=panels.length===0;
 panels.forEach(p=>{
  const [x0,y0,x1,y1]=p.rect,b=document.createElement("button");b.type="button";b.className="figure-hotspot";
  b.style.left=(x0*100)+"%";b.style.top=(y0*100)+"%";b.style.width=((x1-x0)*100)+"%";b.style.height=((y1-y0)*100)+"%";
  b.setAttribute("aria-label","查看子图"+p.letter+"："+p.title);b.setAttribute("aria-pressed","false");
  const tag=document.createElement("span");tag.textContent="("+p.letter+")";b.append(tag);b.addEventListener("click",ev=>{ev.stopPropagation();showPanel(id,p,b);});hs.append(b);
 });
 document.getElementById("figure-modal").classList.add("open");
}
function closeFigure(){document.getElementById("figure-modal").classList.remove("open");closePanel();activeFigure=null;}
document.addEventListener("click",ev=>{
 const term=ev.target.closest("[data-term]");if(term){openTerm(term.dataset.term,term);return;}
 if(ev.target.closest("#term-popover-close")){closeTerm();return;}
 if(ev.target.closest("#term-popover"))return;
 if(activeTermButton)closeTerm();
 const fig=ev.target.closest("[data-fig]");if(fig){openFigure(fig.dataset.fig);return;}
 if(ev.target.closest("[data-close-figure]")){closeFigure();return;}
 if(ev.target.classList.contains("modal"))closeFigure();
 if(ev.target.closest("#panel-close"))closePanel();
