<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Literature Reader</title>
<style>
:root{--bg:#0b1220;--surface:#121d2e;--surface2:#17263a;--line:#2b3d54;--text:#edf4fb;--muted:#a9bacd;--accent:#6fc4e8;--good:#8ed6ba;--warn:#f2c879;--danger:#f29a9a;--radius:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at top,#14253a 0,#0b1220 48%);color:var(--text);font:16px/1.68 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button{font:inherit}
.page{width:min(1180px,calc(100% - 36px));margin:0 auto;padding:42px 0 90px}
h1{font-size:clamp(30px,4vw,48px);line-height:1.2;letter-spacing:-.025em;margin:0 0 26px;font-weight:760}
h2{font-size:25px;line-height:1.3;margin:0}
h3{font-size:18px;line-height:1.4;margin:0 0 10px}
h4{font-size:15px;margin:0 0 7px}
p{margin:8px 0;color:#d8e3ee}
.hero{padding:8px 0 0}
.guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 24px}
.guide-card{background:linear-gradient(155deg,#1b2d43,#121e30);border:1px solid #38516c;border-radius:var(--radius);padding:20px;min-width:0;box-shadow:0 12px 28px #0002}
.guide-card h3{color:#8ed8f2;font-size:19px;margin-bottom:14px}
.guide-card .info-row{border-top:1px solid #ffffff12;padding:9px 0}
.guide-card .info-row:first-child{border-top:0}
.prior-item{padding:12px 0;border-top:1px solid #ffffff18}
.prior-item:first-child{border-top:0;padding-top:0}
.metadata{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px;padding:0 0 22px;border-bottom:1px solid var(--line);margin-bottom:20px}
.metadata a{color:var(--accent)}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 32px}
.nav a{color:#c8d7e7;text-decoration:none;border:1px solid var(--line);background:#111d2d;padding:6px 11px;border-radius:999px;font-size:13px}
.nav a:hover{border-color:var(--accent);color:white}
.section{margin:42px 0}
.section-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.section-head>span{color:#75c5e7;font:700 13px/1.8 ui-monospace,monospace;border:1px solid #3d6c8a;border-radius:7px;padding:2px 8px}
.section-head p{color:var(--muted);margin:4px 0 0;font-size:14px}
.finding-grid,.link-grid,.review-grid,.transfer-grid,.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.finding-card,.link-card,.review-card,.transfer-card,.result-card,.equation-card,.info-panel,.figure-card,.method-node,.unresolved-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.finding-no{font:700 12px ui-monospace,monospace;color:var(--accent);letter-spacing:.1em;margin-bottom:8px}
.finding-card h3{font-size:19px}
.relation,.tag{display:inline-block;border:1px solid #42617d;color:#acd9ed;background:#1b344b;border-radius:999px;padding:2px 9px;font-size:12px}
.info-row{display:grid;grid-template-columns:115px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid #ffffff12;font-size:14px}
.info-row strong{color:#9fb4c9;font-weight:600}
.info-row span{overflow-wrap:anywhere;color:#e2ebf4}
.source-ref{font-size:13px;color:#a9c8dc;border-left:2px solid #4d94b8;padding:5px 0 5px 10px;margin-top:10px}
.source-ref b{display:block;color:#7dc6e7;font-size:11px;letter-spacing:.08em;margin-bottom:3px}
.empty-note{color:var(--muted);background:#101b2b;border:1px dashed #3a4c60;border-radius:12px;padding:14px}
.tree-root{border:1px solid #5c86a6;background:#18334a;border-radius:12px;padding:12px 16px;text-align:center;margin-bottom:14px;font-weight:700}
.method-tree-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.method-node{border-left:4px solid var(--node-accent,#6fc4e8);padding:15px}
.method-node[data-depth="2"]{background:#152338}
.method-node[data-depth="3"],.method-node[data-depth="4"],.method-node[data-depth="5"]{background:#101b2b}
.method-node-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.method-node-head h3{margin:0}
.method-children{display:grid;gap:10px;margin:14px 0 0 13px;padding-left:13px;border-left:1px dashed #49627a}
.equation-card{margin:12px 0}
.equation-expression{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1422;border:1px solid #293d53;border-radius:10px;padding:12px;font:15px/1.6 ui-monospace,Consolas,monospace;color:#d7efff}
.figure-card{margin:16px 0}
.figure-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.figure-image-wrap{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:10px;overflow:hidden;background:#08111d}
.figure-image{display:block;max-width:100%;max-height:780px;height:auto;cursor:zoom-in}
.hotspot-layer{position:absolute;inset:0}
.hotspot{position:absolute;border:1.5px solid #6ed2f5;background:#44b7e21a;color:white;padding:0;cursor:pointer;border-radius:3px}
.hotspot span{position:absolute;left:0;top:0;background:#155071;color:#fff;font:700 12px ui-monospace,monospace;padding:2px 5px;line-height:1.2}
.hotspot:hover,.hotspot:focus-visible{background:#50c9f044;outline:2px solid #b4eaff}
.panel-detail{margin-top:14px;border:1px solid #4a7896;background:#132a3d;border-radius:12px;padding:16px}
.panel-detail[hidden]{display:none}
.panel-detail-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.panel-detail h4{font-size:17px;color:#9fe1f8}
.panel-detail button,.small-button{border:1px solid #49647c;background:#1b3046;color:#e8f4fb;border-radius:8px;padding:5px 10px;cursor:pointer}
.term{display:inline;color:#a7e2f7;background:transparent;border:0;border-bottom:1px dashed #6eabc7;padding:0 1px;cursor:pointer;font:inherit}
.term:hover{color:white;border-bottom-style:solid}
.modal{position:fixed;inset:0;background:#020812d9;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-card{width:min(760px,100%);max-height:85vh;overflow:auto;background:#15243a;border:1px solid #54718d;border-radius:18px;padding:22px;box-shadow:0 25px 80px #0009}
.modal-card h3{font-size:21px;color:#a9e2f7}
.modal-close{float:right}
.lightbox img{max-width:95vw;max-height:88vh;object-fit:contain}
.lightbox .modal-card{width:auto;padding:10px;background:#09111c}
.footer-note{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px;margin-top:48px}
@media(max-width:850px){.guide-grid{grid-template-columns:1fr}.method-tree-grid,.finding-grid,.link-grid,.review-grid,.transfer-grid,.result-grid{grid-template-columns:1fr}.page{width:min(100% - 24px,720px);padding-top:25px}.info-row{grid-template-columns:100px 1fr}}
@media(prefers-reduced-motion:no-preference){.guide-card,.finding-card,.figure-card{transition:border-color .18s ease,transform .18s ease}.guide-card:hover,.finding-card:hover{border-color:#5b86a5;transform:translateY(-1px)}}
</style>
</head>
<body>
<div class="page">
<!-- CONTENT -->
</div>
<div class="modal" id="term-modal" role="dialog" aria-modal="true" aria-labelledby="term-title">
  <div class="modal-card">
    <button class="modal-close small-button" data-close-term type="button">关闭 ×</button>
    <h3 id="term-title"></h3>
    <div id="term-body"></div>
  </div>
</div>
<div class="modal lightbox" id="image-modal" role="dialog" aria-modal="true" aria-label="原图放大查看">
  <div class="modal-card"><button class="modal-close small-button" data-close-image type="button">关闭 ×</button><img id="lightbox-image" alt="原图放大"></div>
</div>
<script id="reader-data" type="application/json"><!-- DATA --></script>
<script>
(function(){
  "use strict";
  const payloadNode=document.getElementById("reader-data");
  let payload={glossary:{},figures:{}};
  try{payload=JSON.parse(payloadNode.textContent||"{}");}catch(e){payload={glossary:{},figures:{}};}
  const termModal=document.getElementById("term-modal");
  const imageModal=document.getElementById("image-modal");
  const termTitle=document.getElementById("term-title");
  const termBody=document.getElementById("term-body");
  const lightboxImage=document.getElementById("lightbox-image");

  function addTextBlock(parent,label,value){
    if(value===undefined||value===null||String(value).trim()==="") return;
    const row=document.createElement("div");
    row.className="info-row";
    const strong=document.createElement("strong");
    strong.textContent=label;
    const span=document.createElement("span");
    span.textContent=Array.isArray(value)?value.join("；"):String(value);
    row.append(strong,span);
    parent.append(row);
  }
  function openTerm(term){
    const item=(payload.glossary||{})[term];
    if(!item)return;
    termTitle.textContent=term+(item.full_name?"｜"+item.full_name:"");
    termBody.replaceChildren();
    addTextBlock(termBody,"中文翻译",item.chinese_translation);
    addTextBlock(termBody,"本文含义",item.meaning_in_this_paper);
    addTextBlock(termBody,"本文作用",item.role);
    addTextBlock(termBody,"相关区别",item.distinction);
    addTextBlock(termBody,"来源",item.source_ref);
    termModal.classList.add("open");
  }
  function closeTerm(){termModal.classList.remove("open");}
  function openImage(src,alt){
    if(!src)return;
    lightboxImage.src=src;lightboxImage.alt=alt||"原图放大";
    imageModal.classList.add("open");
  }
  function closeImage(){imageModal.classList.remove("open");lightboxImage.removeAttribute("src");}
  function openPanel(figureId,panelId,button){
    const fig=(payload.figures||{})[figureId];
    const panel=fig&&fig.panels?fig.panels[panelId]:null;
    if(!panel)return;
    const card=document.getElementById("detail-"+figureId);
    if(!card)return;
    const current=card.dataset.activePanel;
    if(current===panelId){
      card.hidden=true;card.dataset.activePanel="";button.setAttribute("aria-expanded","false");return;
    }
    card.replaceChildren();
    const head=document.createElement("div");head.className="panel-detail-head";
    const title=document.createElement("h4");title.textContent=(panel.hotspot_label||panel.original_label||panelId)+"｜"+(panel.title||"子图解读");
    const close=document.createElement("button");close.type="button";close.className="small-button";close.textContent="收起";
    close.addEventListener("click",()=>{card.hidden=true;card.dataset.activePanel="";document.querySelectorAll('.hotspot[data-figure="'+CSS.escape(figureId)+'"]').forEach(b=>b.setAttribute("aria-expanded","false"));});
    head.append(title,close);card.append(head);
    addTextBlock(card,"实验目的",panel.purpose);
    addTextBlock(card,"怎么看",panel.how_to_read);
    addTextBlock(card,"观察结果",panel.observations);
    addTextBlock(card,"论证作用",panel.argument_supported);
    addTextBlock(card,"解读边界",panel.evidence_boundary);
    addTextBlock(card,"证据位置",panel.source_ref);
    card.hidden=false;card.dataset.activePanel=panelId;
    document.querySelectorAll('.hotspot[data-figure="'+CSS.escape(figureId)+'"]').forEach(b=>b.setAttribute("aria-expanded",b===button?"true":"false"));
  }
  document.addEventListener("click",function(event){
    const term=event.target.closest("[data-term]");
    if(term){openTerm(term.dataset.term);return;}
    const hotspot=event.target.closest(".hotspot");
    if(hotspot){openPanel(hotspot.dataset.figure,hotspot.dataset.panel,hotspot);return;}
    const zoom=event.target.closest("[data-zoom]");
    if(zoom){openImage(zoom.dataset.zoom,zoom.dataset.alt);return;}
    if(event.target.closest("[data-close-term]")){closeTerm();return;}
    if(event.target.closest("[data-close-image]")){closeImage();return;}
    if(event.target===termModal)closeTerm();
    if(event.target===imageModal)closeImage();
  });
  document.addEventListener("keydown",function(event){
    if(event.key==="Escape"){closeTerm();closeImage();}
  });
})();
</script>
</body>
</html>
