<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d17">
<title>__PAGE_TITLE__</title>
<style>
:root{color-scheme:dark;--bg:#080d17;--panel:#111a2b;--card:#162239;--line:rgba(165,196,239,.18);--text:#f1f5ff;--muted:#b0c0d5;--soft:#88a0bb;--cyan:#78def0;--lav:#c0b5ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse 70% 23% at 91% 0%,rgba(77,99,185,.17),transparent 70%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(1630px,calc(100% - 52px));margin:auto;padding:34px 0 74px}h1{font-size:clamp(26px,2.2vw,39px);line-height:1.35;margin:0 0 8px;font-weight:780;letter-spacing:-.035em}header .sub{color:#aebfd2;line-height:1.8;font-size:15px;margin:0 0 22px}.head-cn{font-size:16px;font-weight:650;color:#b9dded;margin-bottom:5px}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 30px}.nav a{text-decoration:none;color:#aabbd2;border:1px solid var(--line);background:#141d2e;border-radius:9px;padding:8px 11px;font-size:13px}.nav a:hover,.nav a:focus-visible{color:#eaf9ff;background:#203650;border-color:#6595bc}
.reviewer-view{margin:0 0 27px;padding:23px;border:1px solid rgba(127,188,224,.25);border-radius:17px;background:linear-gradient(145deg,rgba(19,34,53,.96),rgba(13,23,38,.96));box-shadow:0 14px 38px rgba(0,0,0,.16)}
.reviewer-intro{margin-bottom:17px}.reviewer-kicker{font:700 10px ui-monospace,monospace;letter-spacing:.16em;color:#7fd6e9}.reviewer-intro h2{font-size:22px;line-height:1.45;margin:7px 0}.reviewer-intro>p{color:#aebfd1;font-size:13px;line-height:1.75;margin:0}
.reviewer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.reviewer-card,.reviewer-example{min-width:0;border:1px solid rgba(161,190,220,.17);border-radius:12px;background:rgba(22,36,56,.82);padding:16px}
.reviewer-number{display:inline-flex;align-items:center;justify-content:center;min-width:29px;height:25px;padding:0 7px;border:1px solid rgba(126,197,222,.28);border-radius:6px;color:#9fe5f1;background:rgba(75,148,175,.12);font:700 11px ui-monospace,monospace}
.reviewer-card h3,.reviewer-example h3{font-size:15px;line-height:1.5;margin:10px 0 7px;color:#e6f0fc}.reviewer-card p,.reviewer-example-head p,.reviewer-step p{font-size:13px;line-height:1.85;color:#bdcada;margin:0;white-space:pre-line}
.reviewer-example{margin-top:13px;background:rgba(17,31,49,.9)}.reviewer-example-head{display:flex;gap:12px;align-items:flex-start}.reviewer-example-head h3{margin:0 0 5px}.reviewer-example-head p{color:#9fb2c6}
.reviewer-example-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px}.reviewer-step{padding:12px;border:1px solid rgba(145,181,211,.14);border-radius:9px;background:rgba(7,15,27,.35);min-width:0}.reviewer-step>span{display:block;font-size:12px;font-weight:700;color:#8fdceb;margin-bottom:6px}.reviewer-step p{font-size:12.5px}
.flow{display:grid;gap:29px}.module{scroll-margin-top:20px;display:grid;grid-template-columns:minmax(290px,.37fr) minmax(0,.63fr);gap:25px;align-items:start}
.result{border:1px solid rgba(137,185,235,.27);border-radius:16px;background:linear-gradient(145deg,rgba(24,36,57,.98),rgba(15,24,40,.96));padding:23px;box-shadow:0 15px 42px rgba(0,0,0,.19);position:sticky;top:20px;min-height:180px}
.count{display:inline-flex;color:#c6e1ff;border:1px solid rgba(130,187,235,.32);background:rgba(120,168,221,.08);border-radius:7px;font:12px ui-monospace,monospace;letter-spacing:.15em;padding:7px 11px}
.result h2{font-size:23px;line-height:1.52;margin:16px 0 12px;letter-spacing:-.02em}.result p{color:var(--muted);font-size:15px;line-height:1.83;margin:0}.result .loc{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;color:var(--soft);font-size:12px;line-height:1.7}
.tree{min-width:0;border-left:1px solid rgba(127,189,227,.3);padding-left:23px;position:relative}.tree:before{content:"";width:21px;position:absolute;left:0;top:19px;height:1px;background:#5e8faa}
.treetop{display:flex;gap:12px;align-items:center;margin-bottom:17px}.treetop b{padding:8px 14px;background:rgba(106,126,216,.11);color:#d8d4fc;border:1px solid rgba(152,156,238,.3);border-radius:8px;font-size:14px;line-height:1.5}.treetop i{height:1px;background:linear-gradient(90deg,#6b88a9,transparent);flex:1}
.branches{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-left:17px;border-left:1px dashed rgba(116,200,237,.26)}
.branch{position:relative;padding:16px;border:1px solid #3c5268;background:linear-gradient(145deg,#1d2b3b,#172334);border-radius:14px;min-width:0;box-shadow:0 8px 20px rgba(0,0,0,.11)}
.branch:before{content:"";position:absolute;left:-18px;top:26px;width:17px;height:1px;background:rgba(124,207,230,.56)}.branch:after{content:"";position:absolute;left:-22px;top:22px;width:8px;height:8px;background:#102239;border:2px solid #809cb3;border-radius:50%}
.branch[data-level="2"]{background:linear-gradient(145deg,#203336,#19292e);border-color:#426065}.branch[data-level="3"]{background:linear-gradient(145deg,#302e3d,#242436);border-color:#5c556b}.branch[data-level="4"]{background:linear-gradient(145deg,#35302e,#292728);border-color:#6a5b54}
.branchhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.branch h3{margin:0;font-size:16px;line-height:1.5}.branchtag{font-size:11px;color:#d5e3f0;background:rgba(119,148,177,.115);padding:3px 7px;border-radius:6px;border:1px solid #3c5268}
.branchgoal{color:#a8bbcc;font-size:13px;line-height:1.65;margin:8px 0 12px}.method{border-top:1px solid rgba(166,189,218,.15);padding-top:12px;margin-top:12px}
.method h4{color:#e9f1ff;margin:0 0 7px;font-size:16px;line-height:1.5}.method .core{font-size:15px;color:#a5e9f5;font-weight:680;line-height:1.65;margin:5px 0}.method .effect{color:#bdc9d8;font-size:13px;line-height:1.75;margin:6px 0 9px}.method .role{font-size:11px;color:#b8bcf1}
.details-btn{cursor:pointer;background:none;border:0;padding:8px 0 2px;color:#b3bcff;font-size:13px;font-weight:600;text-align:left}.details-btn:after{content:" ▾"}.details-btn[aria-expanded="true"]:after{content:" ▴"}.details{margin-top:10px;border:1px solid rgba(125,165,210,.17);border-radius:9px;background:rgba(7,13,25,.4);padding:11px 12px}.details[hidden]{display:none}
.drow{padding:7px 0;color:#b6c7db;line-height:1.77;font-size:12.8px;border-bottom:1px dotted rgba(151,187,218,.12)}.drow:last-child{border-bottom:0}.drow strong{display:block;color:#dcefff;font-size:12px;margin-bottom:2px}
.evidence{margin-top:15px;border:1px solid rgba(138,179,215,.21);border-radius:11px;padding:12px 14px;background:rgba(23,34,52,.75);display:flex;justify-content:space-between;align-items:center;gap:13px}
.evidence .evtitle{font-weight:670;font-size:13px;color:#d1dcf6}.evidence .evtext{color:#a9bacc;font-size:12px;line-height:1.75;margin-top:4px}.figbtn{cursor:pointer;border:1px solid rgba(111,200,225,.3);background:rgba(79,156,181,.13);border-radius:8px;color:#a7e9f2;padding:10px 13px;font-size:12px}
.term{display:inline;cursor:pointer;color:#a4eaf8;font:inherit;font-weight:620;padding:0;background:none;border:0;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}
.term-card{z-index:10001;position:fixed;width:min(385px,calc(100vw - 24px));max-height:min(68vh,520px);overflow:auto;padding:19px;border:1px solid rgba(148,190,225,.4);border-radius:14px;background:#18243a;box-shadow:0 24px 85px #000b;display:none}
.term-head{display:flex;justify-content:space-between;gap:10px}.term-head b{font-size:18px}.term-full{color:#b3c7db;font-size:12px;margin-top:5px}.term-cn{margin-top:11px;color:#a3e5f3;font-weight:680;font-size:14px}.term-card p{font-size:13px;line-height:1.85;color:#ced9e7;margin:8px 0 0}.term-card h5{color:#e0e7ff;font-size:12px;margin:15px 0 0}.close{border:0;background:#283952;color:#dbefff;width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:20px}
.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:10000;background:rgba(2,5,12,.91);display:flex;align-items:center;justify-content:center;padding:36px 17px 20px;overflow:auto}
.modalwrap{position:relative;max-width:min(1530px,100%);width:100%;max-height:calc(100vh - 58px);display:flex;flex-direction:column;align-items:stretch;gap:8px}
.mclose{position:absolute;right:0;top:-34px;border:0;background:rgba(255,255,255,.12);border-radius:7px;color:#fff;font-size:22px;width:34px;height:30px;cursor:pointer;z-index:5}
.fig-layout{display:flex;gap:18px;justify-content:center;align-items:flex-start;max-height:82vh;min-width:0}.fig-sheet{position:relative;flex:0 1 auto;min-width:0;align-self:flex-start;line-height:0}.fig-sheet>img{display:block;width:auto;height:auto;max-height:81vh;max-width:100%;object-fit:contain;background:#fff;border-radius:4px}
.fig-hotspots{position:absolute;inset:0;pointer-events:none}.fig-hotspot{position:absolute;z-index:1;cursor:pointer;pointer-events:auto;color:#ebfaff;background:rgba(57,188,219,.01);border:1.5px solid transparent;border-radius:5px;padding:0}
.fig-hotspot:before{content:attr(data-letter);position:absolute;top:4px;right:4px;min-width:19px;height:19px;display:grid;place-items:center;background:rgba(10,26,43,.87);border:1px solid rgba(147,223,250,.7);border-radius:5px;font:700 12px ui-monospace,monospace;color:#d0faff}
.fig-hotspot:hover,.fig-hotspot:focus-visible,.fig-hotspot[aria-pressed=true]{background:rgba(61,185,248,.15);border-color:#69d5fb}
.subplot-card[hidden]{display:none}.subplot-card{width:min(438px,40vw);min-width:320px;flex:0 0 auto;max-height:81vh;overflow:auto;border:1px solid rgba(118,201,232,.39);border-radius:15px;background:linear-gradient(160deg,#1b3049,#111c30);padding:20px;line-height:1.6}
.subplot-top{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(168,212,239,.19)}.subplot-kicker{font:700 11px ui-monospace,monospace;color:#82d9ef}.subplot-top h3{font-size:19px;margin:7px 0 1px}.subplot-x{cursor:pointer;border:1px solid #466681;background:#263b57;color:#edf8ff;width:30px;height:30px;border-radius:7px;font-size:20px}
.subplot-zoom{margin-top:13px;border-radius:9px;background:#fff;padding:7px;text-align:center}.subplot-zoom canvas{max-width:100%;height:auto;max-height:220px}
.subplot-section{padding-top:13px}.subplot-section h4{font-size:12px;color:#92e1ed;margin:0 0 4px}.subplot-section p{color:#d4e1f2;font-size:13px;line-height:1.78;margin:0}.subplot-source{border-top:1px solid rgba(168,212,239,.2);padding-top:10px;margin-top:15px;color:#96abc2;font-size:11.5px}
.fig-meta{display:flex;justify-content:space-between;gap:10px;color:#d7e8f7;font-size:12px;margin:2px auto 0}.fig-tip{color:#9fe5f4;font-size:11.5px}
.sequence{display:flex;flex-direction:column;gap:0}.sequence-divider{text-align:center;padding:11px;color:#9cb9c9;font-size:12px}
@media(max-width:950px){.reviewer-grid{grid-template-columns:1fr}.reviewer-example-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.module{grid-template-columns:minmax(250px,.4fr) minmax(0,.6fr);gap:16px}.branches{grid-template-columns:1fr}.fig-layout{flex-direction:column;align-items:center;overflow-y:auto;max-height:85vh}.fig-sheet{max-width:100%;margin:auto}.fig-sheet>img{max-height:none;width:100%}.subplot-card{width:100%;min-width:0;max-height:none}.fig-meta{display:block}}
@media(max-width:750px){main{width:calc(100% - 24px);padding-top:24px}.module{grid-template-columns:1fr;gap:12px}.result{position:static;min-height:0;padding:18px}.tree{margin-left:11px;padding-left:16px}.evidence{flex-wrap:wrap}.reviewer-view{padding:17px}.reviewer-example-grid{grid-template-columns:1fr}.reviewer-intro h2{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
__MAIN__
<section id="termCard" class="term-card" role="dialog" aria-label="术语解释">
  <div class="term-head"><div><b id="termTitle"></b><div id="termFull" class="term-full"></div></div><button type="button" class="close" id="termClose" aria-label="关闭术语解释">×</button></div>
  <div id="termCn" class="term-cn"></div><h5>概念解释</h5><p id="termDef"></p><h5>在本文中的作用</h5><p id="termUse"></p>
</section>
<section id="figureModal" class="modal" hidden role="dialog" aria-label="论文组合图及子图详解">
  <div class="modalwrap"><button class="mclose" id="figClose" type="button" aria-label="关闭原文图像">×</button>
    <div class="fig-layout"><div class="fig-sheet" id="figSheet"><img id="figImage" alt="论文原文组合图"><div id="panelHotspots" class="fig-hotspots"></div></div>
      <aside id="subplotCard" class="subplot-card" hidden><div class="subplot-top"><div><div id="subplotKicker" class="subplot-kicker"></div><h3 id="subplotTitle"></h3></div><button class="subplot-x" id="subplotClose" type="button" aria-label="收起子图解释">×</button></div>
        <div class="subplot-zoom"><canvas id="subplotCanvas"></canvas></div>
        <div class="subplot-section"><h4>实验目的</h4><p id="subplotPurpose"></p></div>
        <div class="subplot-section"><h4>怎么看这幅图</h4><p id="subplotHow"></p></div>
        <div class="subplot-section"><h4>观察到的结果</h4><p id="subplotResult"></p></div>
        <div class="subplot-section"><h4>对论文结论的支撑</h4><p id="subplotSignificance"></p></div>
        <div class="subplot-section"><h4>解读边界</h4><p id="subplotLimit"></p></div><div class="subplot-source" id="subplotSource"></div>
      </aside>
    </div><div class="fig-meta"><label id="figCaption"></label><span class="fig-tip">点击图中 a、b、c 等区域展开对应子图解释</span></div>
  </div>
</section>
<script>
'use strict';
const glossary=__GLOSSARY_JSON__;
const figureImages=__FIGURE_IMAGES_JSON__;
const figurePanels=__FIGURE_PANELS_JSON__;
const figureMeta=__FIGURE_META_JSON__;

document.querySelectorAll('.details-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const panel=btn.nextElementSibling;
    const open=btn.getAttribute('aria-expanded')==='true';
    btn.setAttribute('aria-expanded',String(!open));
    panel.hidden=open;
  });
});

const modal=document.getElementById('figureModal');
const figImage=document.getElementById('figImage');
const hotspots=document.getElementById('panelHotspots');
const subplotCard=document.getElementById('subplotCard');
let openFigureNumber=null,openPanelLetter=null;

function closeSubplot(){
  subplotCard.hidden=true;openPanelLetter=null;
  hotspots.querySelectorAll('.fig-hotspot').forEach(btn=>btn.setAttribute('aria-pressed','false'));
}
function drawPanelCrop(panel){
  const canvas=document.getElementById('subplotCanvas'),ctx=canvas.getContext('2d');
  if(!figImage.complete||!figImage.naturalWidth){figImage.addEventListener('load',()=>drawPanelCrop(panel),{once:true});return;}
  const [left,top,right,bottom]=panel.rect;
  const x=left*figImage.naturalWidth,y=top*figImage.naturalHeight;
  const w=(right-left)*figImage.naturalWidth,h=(bottom-top)*figImage.naturalHeight;
  const scale=Math.min(1.5,720/w,370/h);
  canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(figImage,x,y,w,h,0,0,canvas.width,canvas.height);
}
function selectSubfigure(letter){
  if(openPanelLetter===letter){closeSubplot();return;}
  const panel=(figurePanels[openFigureNumber]||[]).find(x=>x.letter===letter);if(!panel)return;
  openPanelLetter=letter;
  hotspots.querySelectorAll('.fig-hotspot').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.letter===letter)));
  document.getElementById('subplotKicker').textContent='FIG. '+openFigureNumber+letter+' · SUBPLOT';
  document.getElementById('subplotTitle').textContent=panel.title;
  for(const [field,id] of [['purpose','subplotPurpose'],['how','subplotHow'],['result','subplotResult'],['significance','subplotSignificance'],['limit','subplotLimit'],['source','subplotSource']]){
    document.getElementById(id).textContent=panel[field]||'原文未报告';
  }
  subplotCard.hidden=false;drawPanelCrop(panel);
  if(window.innerWidth<=960)subplotCard.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function populateFigureHotspots(num){
  hotspots.replaceChildren();
  for(const p of (figurePanels[num]||[])){
    const [x1,y1,x2,y2]=p.rect;
    const button=document.createElement('button');button.type='button';button.className='fig-hotspot';
    button.dataset.letter=p.letter;button.setAttribute('data-letter',p.letter);
    button.setAttribute('aria-label','查看图 '+num+' 的子图 '+p.letter+'：'+p.title);
    button.setAttribute('aria-pressed','false');
    button.style.left=(x1*100)+'%';button.style.top=(y1*100)+'%';
    button.style.width=((x2-x1)*100)+'%';button.style.height=((y2-y1)*100)+'%';
    button.addEventListener('click',ev=>{ev.stopPropagation();selectSubfigure(p.letter);});
    hotspots.append(button);
  }
}
function closeFig(){modal.hidden=true;closeSubplot();figImage.removeAttribute('src');openFigureNumber=null;}
document.querySelectorAll('[data-fig]').forEach(btn=>btn.addEventListener('click',()=>{
  const num=btn.dataset.fig;closeSubplot();openFigureNumber=num;
  figImage.src=figureImages[num];figImage.alt='Fig. '+num+' 原文组合图';
  document.getElementById('figCaption').textContent=(figureMeta[num]?.source||('Fig. '+num))+' · '+(figurePanels[num]||[]).length+'个可点选子图';
  populateFigureHotspots(num);modal.hidden=false;document.getElementById('figClose').focus();
}));
document.getElementById('figClose').addEventListener('click',closeFig);
document.getElementById('subplotClose').addEventListener('click',closeSubplot);
modal.addEventListener('click',ev=>{if(ev.target===modal)closeFig();});

const card=document.getElementById('termCard');
const termList=Object.keys(glossary).sort((a,b)=>b.length-a.length);
if(termList.length){
  const escaped=termList.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const re=new RegExp(escaped.join('|'),'gi'),ascii=/[A-Za-z0-9_]/;
  const walker=document.createTreeWalker(document.querySelector('main'),NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue.trim()||!n.parentElement||n.parentElement.closest('script,style,button,nav,.loc'))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const all=[];while(walker.nextNode())all.push(walker.currentNode);
  for(const n of all){
    const s=n.nodeValue,frag=document.createDocumentFragment();re.lastIndex=0;
    let last=0,found=false,m;
    while((m=re.exec(s))){
      const st=m.index,ed=st+m[0].length,first=m[0][0],end=m[0].slice(-1);
      if((ascii.test(first)&&st>0&&ascii.test(s[st-1]))||(ascii.test(end)&&ed<s.length&&ascii.test(s[ed])))continue;
      const key=termList.find(k=>k.toLowerCase()===m[0].toLowerCase());if(!key)continue;
      frag.append(document.createTextNode(s.slice(last,st)));
      const b=document.createElement('button');b.type='button';b.className='term';b.dataset.key=key;b.textContent=m[0];
      b.setAttribute('aria-expanded','false');b.setAttribute('aria-haspopup','dialog');frag.append(b);
      found=true;last=ed;
    }
    if(found){frag.append(document.createTextNode(s.slice(last)));n.parentNode.replaceChild(frag,n);}
  }
}
let activeTerm=null;
function closeTerm(){card.style.display='none';if(activeTerm)activeTerm.setAttribute('aria-expanded','false');activeTerm=null;}
function openTerm(btn){
  if(activeTerm===btn){closeTerm();return;}closeTerm();activeTerm=btn;btn.setAttribute('aria-expanded','true');
  const d=glossary[btn.dataset.key];
  document.getElementById('termTitle').textContent=btn.dataset.key;
  document.getElementById('termFull').textContent=d[0];document.getElementById('termCn').textContent=d[1];
  document.getElementById('termDef').textContent=d[2];document.getElementById('termUse').textContent=d[3];
  card.style.display='block';card.style.visibility='hidden';card.style.left='12px';card.style.top='12px';
  const b=btn.getBoundingClientRect(),c=card.getBoundingClientRect(),margin=12;
  const x=Math.max(margin,Math.min(b.left,innerWidth-c.width-margin));
  let y=b.bottom+9;if(y+c.height>innerHeight-margin)y=b.top-c.height-9;
  y=Math.max(margin,Math.min(y,innerHeight-c.height-margin));card.style.left=x+'px';card.style.top=y+'px';card.style.visibility='visible';
}
document.addEventListener('click',ev=>{
  const btn=ev.target.closest('.term');
  if(btn){ev.preventDefault();openTerm(btn);return;}
  if(activeTerm&&!ev.target.closest('#termCard'))closeTerm();
});
document.getElementById('termClose').addEventListener('click',closeTerm);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeTerm();closeFig();}});
window.addEventListener('resize',closeTerm);
window.addEventListener('scroll',closeTerm,{passive:true,capture:true});
</script>
</body>
</html>
